<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chris' Music Review</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css?v=20260820b">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <button class="site-title" id="home-link" type="button">Chris' Music Review</button>
    </div>
  </header>

  <nav class="site-tabs-wrap">
    <div class="wrap">
      <div class="site-tabs" id="site-tabs">
        <!-- Year tabs are rendered here by app.js -->
      </div>
    </div>
  </nav>

  <main class="wrap">
    <section id="posts" class="posts">
      <!-- Posts are rendered here by app.js from posts.js -->
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; <span id="year"></span></p>
    </div>
  </footer>

  <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top">&uarr;</button>

  <!-- Bump the ?v= on these two whenever posts.js/app.js change, so browsers
       and GitHub Pages' CDN don't serve a stale cached copy after a deploy. -->
  <script src="posts.js?v=20260820c"></script>
  <script src="app.js?v=20260820d"></script>
</body>
</html>
