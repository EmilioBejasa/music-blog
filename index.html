<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hit Takes — 2020s Music Thoughts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <button class="site-title" id="home-link" type="button">Hit Takes</button>
      <p class="site-subtitle">unfiltered thoughts on the hit music of the 2020s</p>
    </div>
  </header>

  <nav class="site-tabs-wrap">
    <div class="wrap">
      <div class="site-tabs" id="site-tabs">
        <!-- Year tabs are rendered here by app.js -->
      </div>
    </div>
  </nav>

  <main class="wrap">
    <section id="posts" class="posts">
      <!-- Posts are rendered here by app.js from posts.js -->
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; <span id="year"></span> Hit Takes</p>
    </div>
  </footer>

  <script src="posts.js"></script>
  <script src="app.js"></script>
</body>
</html>
